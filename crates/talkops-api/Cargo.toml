[package]
name = "talkops-api"
description = "TalkOps control plane: REST API, web UI hosting and FreeSWITCH integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "talkops"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { workspace = true, features = ["serde"] }
chrono-tz = "0.10"
clap.workspace = true
hex = "0.4.3"
hound = "3.5.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
roxmltree = "0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
sqlx = { workspace = true, features = ["postgres"] }
talkops-core.workspace = true
talkops-doorbell = { version = "0.1.0", path = "../talkops-doorbell" }
talkops-esl.workspace = true
talkops-provisioning = { version = "0.1.0", path = "../talkops-provisioning" }
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["io"] }
thiserror.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum = "0.2.0"
webpki-roots = "1"
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower.workspace = true

[lints]
workspace = true
