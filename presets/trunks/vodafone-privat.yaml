# Vodafone – DSL/Kabel/Glasfaser-Anschluss (Privat)
# Status: untested. See docs/trunk-presets.md for the format.
id: vodafone-privat
name: Vodafone
product: DSL/Kabel/Glasfaser-Anschluss (Privat)
country: DE
status: untested
sources:
- https://forum.vodafone.de/t5/Ger%C3%A4te/SIP-Zugangsdaten/td-p/3271124
notes:
  en: >-
    The registrar depends on region and access technology (e.g. sip.kabelfon.vodafone.de); take it from
    the credentials letter or 'MeinVodafone'. Usually only works from the Vodafone line itself.
  de: >-
    Der Registrar hängt von Region und Anschlusstechnik ab (z. B. sip.kabelfon.vodafone.de); siehe Zugangsdaten-Brief
    bzw. MeinVodafone. Funktioniert in der Regel nur über den Vodafone-Anschluss selbst.
credentials:
  mode: per_number
  username_template: '{e164_digits}'
  auth_username_template: '{input}'
  username_hint:
    en: SIP username from the credentials letter
    de: SIP-Benutzername aus dem Zugangsdaten-Brief
sip:
  transport: udp
  number_format: national
  caller_id_format: e164
  caller_id_header: from
  from_user: username
