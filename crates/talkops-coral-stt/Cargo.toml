[package]
name = "talkops-coral-stt"
description = "Speech recognition on Google Coral Edge TPUs with an OpenAI-compatible interface"
version.workspace = true
edition.workspace = true
# edgefirst-tflite needs Rust 1.88.
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[[bin]]
name = "talkops-coral-stt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["macros", "multipart", "ws"] }
base64 = "0.22.1"
clap.workspace = true
edgefirst-tflite = "=0.10.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hound = "3.5.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.30.0"
tower.workspace = true

[lints]
workspace = true
