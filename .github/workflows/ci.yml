name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TALKOPS_TEST_LDAP_URL: ldap://127.0.0.1:3890
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Start OpenLDAP for the directory login tests
        run: |
          echo "slapd slapd/no_configuration boolean true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq slapd ldap-utils
          sudo systemctl stop slapd || true
          # Under /var/lib/ldap so the AppArmor profile of slapd allows it.
          sudo LDAP_WORK=/var/lib/ldap/talkops-test tests/ldap/start.sh
      - name: Install PostgreSQL 17 client tools (backup tests)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client-17
      - name: Install rclone (backup target tests)
        run: |
          # Same pinned release and checksum as docker/talkops/Dockerfile.
          curl -fsSLo /tmp/rclone.zip https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  /tmp/rclone.zip" | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 0755 /tmp/rclone-v1.75.2-linux-amd64/rclone /usr/local/bin/rclone
          rclone version
      - run: cargo test --workspace --locked
        env:
          TALKOPS_TEST_PG_BIN_DIR: /usr/lib/postgresql/17/bin

  web:
    name: Web UI (lint, check, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Setup recovery browser test
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          npm exec -- vite preview --host 127.0.0.1 --port 4178 > "$RUNNER_TEMP/recovery-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4178/setup > /dev/null && break
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node ../tests/recovery/browser.mjs
      - name: Active call and layout browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/talkops-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/talkops-browser/node_modules/.bin/playwright" install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 5184 > "$RUNNER_TEMP/talkops-preview.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5184/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/active-calls.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/layout.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/transcription-settings.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/roles.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/settings-system.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/audit.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/call-list.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/phonebook.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/phone-keys.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/transcriptions.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/motion.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/call-presentation.mjs

  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
              -e 's/^TALKOPS_SECRET_KEY=$/TALKOPS_SECRET_KEY=ci/' \
              -e 's/^TALKOPS_ESL_PASSWORD=$/TALKOPS_ESL_PASSWORD=ci/' \
              -e 's/^TALKOPS_XMLCURL_PASSWORD=$/TALKOPS_XMLCURL_PASSWORD=ci/' .env.example > ci.env
          docker compose --env-file ci.env -f docker-compose.yml config -q
          docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Production compose must not build
        run: |
          if grep -nE '^\s+build:' docker-compose.yml; then
            echo "docker-compose.yml must only reference prebuilt images" >&2
            exit 1
          fi
      - name: Validate backup override and host recovery workflow
        run: |
          docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.backup.yml config -q
          TALKOPS_NFS_HOST=nas.local docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.targets.yml config -q
          bash -n scripts/recover.sh
          bash tests/recovery/host.sh

  images:
    name: Image build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: talkops-server
            context: .
            dockerfile: docker/talkops/Dockerfile
          - image: talkops-media-worker
            context: .
            dockerfile: docker/media-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,scope=${{ matrix.image }}-amd64,mode=max
      - name: Smoke test
        run: docker run --rm ${{ matrix.image }}:ci --version
