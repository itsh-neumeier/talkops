id: 1und1-versatel-sip-trunk
name: 1&1 Versatel
product: SIP-Trunk (Business)
country: DE
status: untested
sources:
- https://wiki.unify.com/images/c/c2/SIP-Trunk-Configuration-Versatel.pdf
notes:
