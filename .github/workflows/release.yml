# Publishes images to GHCR and a GitHub release for SemVer tags.
# Releases build amd64 only (ADR 0050). Set the repository variable
# RELEASE_ARM64=true before the tag push to add arm64; arm64 images are built
# natively on GitHub's arm64 runners (QEMU emulation would take hours for the
# FreeSWITCH source build).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build arm64 images
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NAMESPACE: ghcr.io/itsh-neumeier

jobs:
  version:
    name: Tag matches the version in the code
    runs-on: ubuntu-24.04
    outputs:
      arches: ${{ steps.arches.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # The web UI shows the version from Cargo.toml; a tag without raising
      # it would ship images that show the previous version.
      - name: Compare tag, Cargo.toml and web/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          web=$(jq -r .version web/package.json)
          echo "tag=$tag Cargo.toml=$cargo web/package.json=$web"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$web" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($cargo) / web/package.json ($web). Raise the version first."
            exit 1
          fi
      - name: Select image architectures
        id: arches
        env:
          ARM64: ${{ vars.RELEASE_ARM64 == 'true' || inputs.arm64 == true }}
        run: |
          if [ "$ARM64" = "true" ]; then list='["amd64","arm64"]'; else list='["amd64"]'; fi
          echo "Architectures: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [talkops-server, talkops-media-worker, talkops-freeswitch, talkops-coral-stt, talkops-cuda-stt]
        arch: ${{ fromJSON(needs.version.outputs.arches) }}
        exclude:
          # The CUDA libraries of the image exist for amd64 only.
          - image: talkops-cuda-stt
            arch: arm64
        # Only image keys here: an include entry for an architecture that is
        # not selected would add a job of its own.
        include:
          - image: talkops-server
            context: .
            dockerfile: docker/talkops/Dockerfile
          - image: talkops-media-worker
            context: .
            dockerfile: docker/media-worker/Dockerfile
          - image: talkops-freeswitch
            context: docker/freeswitch
            dockerfile: docker/freeswitch/Dockerfile
          - image: talkops-coral-stt
            context: .
            dockerfile: docker/coral-stt/Dockerfile
          - image: talkops-cuda-stt
            context: .
            dockerfile: docker/cuda-stt/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: TALKOPS_BUILD_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.NAMESPACE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Verify Coral runtime on the native architecture
        if: matrix.image == 'talkops-coral-stt'
        run: bash tests/coral/image.sh '${{ env.NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}'
      - name: Verify CUDA runtime libraries
        if: matrix.image == 'talkops-cuda-stt'
        run: bash tests/cuda/image.sh '${{ env.NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}'
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        image: [talkops-server, talkops-media-worker, talkops-freeswitch, talkops-coral-stt, talkops-cuda-stt]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Create image manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.NAMESPACE }}/${{ matrix.image }}@sha256:%s ' *)

  github-release:
    name: GitHub release
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
