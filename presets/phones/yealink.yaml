# Yealink models supported by the TalkOps provisioning templates.
#
# accounts:   number of SIP accounts (DECT bases: handsets/accounts)
# line_keys:  programmable line keys incl. all pages (managed by TalkOps)
# family:     desk | dect | conference | wifi
# Common config file names follow "y0000000000XX.cfg" (hardware id); TalkOps
# serves the same common file for every such name.
#
# Sources: Yealink IP Phones Auto Provisioning Guide V1.3 (2021),
# Yealink SIP-T2/T4 Auto Provisioning Guide V80, product datasheets.
# AX83H/AX86R: Yealink AX83H/AX86R datasheets (Wi-Fi handsets, 4 SIP
# accounts) and the AX documentation on support.yealink.com: "Trigger the
# Phone to Perform Auto Provisioning" (common file y000000000108.cfg for
# both), "Line Key" (16 keys from firmware 180.87.0.15; types 0/11/15/16/39
# only, no speed dial; BLF pickup code in linekey.X.extension), "Ring Tones"
# (WAV up to 8 MB, 8 kHz mono 16 bit), "Wallpaper Settings" (JPG/PNG up to
# 5 MB, 2 megapixels). Both models share one firmware image.
#
# ringtone_max_kb: largest custom ringtone (ringtone.url, WAV 8 kHz mono
#                  16 bit); wallpaper: custom wallpaper (wallpaper_upload.url,
#                  JPG/PNG up to 5 MB). Source: Yealink SIP-T5 Series
#                  Administrator's Guide (covers T5x and T4U), sections
#                  "Custom Ringtone Limit" and "Custom Wallpaper Picture Limit".
#                  Models not listed there keep their own settings.
# Desk display/key maps: Yealink T3/T4U/T5 series specifications and DSS Keys.
# T33G has its four physical buttons on the right of the display.
# Older paged desk models reserve the bottom-right key for page switching;
# the renderer sets features.keep_switch_page_key.enable = 1 to match.
# T73W/T85W have a separate page control; all physical line keys stay usable.
# Touch models use an expanded, scrollable DSS overview, not idle-screen pages.
# Sources and capacity corrections: docs/deskphone-key-editor-proposal.md.
