# TalkOps – production stack (prebuilt images only, usable as Portainer stack).
#
#   cp .env.example .env   # set the passwords
#   docker compose up -d
#
# FreeSWITCH, TalkOps and the media worker use host networking: SIP and the
# RTP port range need it, and it keeps the event socket and the xml_curl
# endpoint on 127.0.0.1. Linux hosts only. See docs/installation.md.

name: talkops

x-talkops-env: &talkops-env
  TALKOPS_DATABASE_URL: postgres://${POSTGRES_USER:-talkops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-talkops}
  TALKOPS_LOG_FORMAT: ${TALKOPS_LOG_FORMAT:-json}
  RUST_LOG: ${RUST_LOG:-info}
  TZ: ${TZ:-Europe/Berlin}

# The TalkOps images run as UID 10001 and need no Linux capabilities.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-trixie
    restart: unless-stopped
    # The entrypoint needs root to prepare the data directory, then drops it.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talkops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-talkops}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Only reachable from the host (where the host-networked services run).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  talkops:
    image: ghcr.io/itsh-neumeier/talkops-server:${TALKOPS_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *talkops-env
      TALKOPS_LISTEN: ${TALKOPS_LISTEN:-0.0.0.0:8080}
      TALKOPS_ESL_ADDR: 127.0.0.1:${TALKOPS_ESL_PORT:-8021}
      TALKOPS_ESL_PASSWORD: ${TALKOPS_ESL_PASSWORD:?set TALKOPS_ESL_PASSWORD}
      TALKOPS_XMLCURL_PASSWORD: ${TALKOPS_XMLCURL_PASSWORD:?set TALKOPS_XMLCURL_PASSWORD}
      TALKOPS_SECRET_KEY: ${TALKOPS_SECRET_KEY:?set TALKOPS_SECRET_KEY}
      TALKOPS_BACKUP_PASSWORD: ${TALKOPS_BACKUP_PASSWORD:-}
      TALKOPS_SETUP_TOKEN: ${TALKOPS_SETUP_TOKEN:-}
      # Recovery backups capture the Compose directory (read-only bind below).
      TALKOPS_DEPLOYMENT_DIR: /var/lib/talkops/deployment
      TALKOPS_DEPLOYMENT_FILES: ${TALKOPS_DEPLOYMENT_FILES:-auto}
      TALKOPS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-talkops}
      TALKOPS_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      TALKOPS_SIP_PORT: ${TALKOPS_SIP_PORT:-5060}
      TALKOPS_SIP_TRUNK_PORT: ${TALKOPS_SIP_TRUNK_PORT:-5080}
      TALKOPS_METRICS_TOKEN: ${TALKOPS_METRICS_TOKEN:-}
      TALKOPS_TURN_URLS: ${TALKOPS_TURN_URLS:-}
      TALKOPS_TURN_SECRET: ${TALKOPS_TURN_SECRET:-}
      TALKOPS_TURN_RELAY_ONLY: ${TALKOPS_TURN_RELAY_ONLY:-false}
      # Call map data (ADR 0044); the image contains it at this path.
      TALKOPS_GEO_DIR: ${TALKOPS_GEO_DIR:-/usr/share/talkops/presets/geo}
    volumes:
      - recordings:/var/lib/talkops/recordings
      - fax:/var/lib/talkops/fax
      - voicemail:/var/lib/talkops/voicemail
      - sounds:/var/lib/talkops/sounds
      - provisioning:/var/lib/talkops/provisioning
      - snapshots:/var/lib/talkops/snapshots
      - backups:/var/lib/talkops/backups
      - cdr-spool:/var/lib/talkops/cdr-spool
      - type: bind
        source: ${TALKOPS_DEPLOYMENT_SOURCE:-.}
        target: /var/lib/talkops/deployment
        read_only: true

  freeswitch:
    image: ghcr.io/itsh-neumeier/talkops-freeswitch:${TALKOPS_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    # FreeSWITCH loads its configuration from TalkOps at startup.
    depends_on:
      talkops:
        condition: service_healthy
    environment:
      TALKOPS_ESL_PORT: ${TALKOPS_ESL_PORT:-8021}
      TALKOPS_ESL_PASSWORD: ${TALKOPS_ESL_PASSWORD:?set TALKOPS_ESL_PASSWORD}
      TALKOPS_XMLCURL_URL: http://127.0.0.1:${TALKOPS_HTTP_PORT:-8080}/fs/xml
      TALKOPS_CDR_URL: http://127.0.0.1:${TALKOPS_HTTP_PORT:-8080}/fs/cdr
      TALKOPS_XMLCURL_PASSWORD: ${TALKOPS_XMLCURL_PASSWORD:?set TALKOPS_XMLCURL_PASSWORD}
      TALKOPS_RTP_START_PORT: ${TALKOPS_RTP_START_PORT:-16384}
      TALKOPS_RTP_END_PORT: ${TALKOPS_RTP_END_PORT:-16999}
      TALKOPS_FS_LOG_LEVEL: ${TALKOPS_FS_LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - recordings:/var/lib/talkops/recordings
      - fax:/var/lib/talkops/fax
      - voicemail:/var/lib/talkops/voicemail
      - sounds:/var/lib/talkops/sounds
      - freeswitch-db:/usr/local/freeswitch/var/lib/freeswitch/db
      # Call records TalkOps could not accept; TalkOps imports them later.
      - cdr-spool:/var/lib/talkops/cdr-spool

  media-worker:
    image: ghcr.io/itsh-neumeier/talkops-media-worker:${TALKOPS_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *talkops-env
      # Decrypts the key of the optional transcription API.
      TALKOPS_SECRET_KEY: ${TALKOPS_SECRET_KEY:?set TALKOPS_SECRET_KEY}
      TALKOPS_WHISPER_MODEL: ${TALKOPS_WHISPER_MODEL:-large-v3-turbo-q5_0}
      TALKOPS_WHISPER_VAD: ${TALKOPS_WHISPER_VAD:-true}
    volumes:
      - recordings:/var/lib/talkops/recordings
      - fax:/var/lib/talkops/fax
      - voicemail:/var/lib/talkops/voicemail
      - sounds:/var/lib/talkops/sounds
      - models:/var/lib/talkops/models

  # Optional speech recognition on a Google Coral Edge TPU in this server
  # (ADR 0046). Enable with COMPOSE_PROFILES=coral, then add the connection
  # "Coral (this server)" in Settings > Calls > Transcription. The service
  # listens on 127.0.0.1 only: audio does not leave the server. Put the
  # compiled models into the models volume (models/coral/{de,en,langid}).
  coral-stt:
    image: ghcr.io/itsh-neumeier/talkops-coral-stt:${TALKOPS_VERSION:-latest}
    profiles: ["coral"]
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TALKOPS_CORAL_LISTEN: 127.0.0.1:${TALKOPS_CORAL_PORT:-8095}
      TALKOPS_CORAL_API_KEY: ${TALKOPS_CORAL_API_KEY:-}
      TALKOPS_CORAL_QUEUE: ${TALKOPS_CORAL_QUEUE:-16}
      TALKOPS_CORAL_SESSIONS_PER_TPU: ${TALKOPS_CORAL_SESSIONS_PER_TPU:-4}
      TALKOPS_CORAL_STABLE_PREVIEW: ${TALKOPS_CORAL_STABLE_PREVIEW:-false}
      TALKOPS_CORAL_MODEL_ADMIN: ${TALKOPS_CORAL_MODEL_ADMIN:-true}
      TALKOPS_LOG_FORMAT: ${TALKOPS_LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info}
      TZ: ${TZ:-Europe/Berlin}
    # USB Accelerator: the stick enumerates again after the firmware load,
    # with a new device number. Bind the whole USB tree and allow all USB
    # devices (character major 189), so the new node works without a
    # container restart. The group must own the device on the host
    # (plugdev, GID 46 on Debian, set by the libedgetpu udev rule).
    volumes:
      # Writable: administrators install models in the TalkOps UI.
      - models:/var/lib/talkops/models
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    group_add:
      - "${TALKOPS_CORAL_GID:-46}"
    # M.2 / Mini PCIe card (gasket/apex driver): add the device and the GID
    # of the host group "apex" instead of or in addition to USB, e.g.:
    # devices:
    #   - /dev/apex_0:/dev/apex_0
    # group_add:
    #   - "998"

  # Optional speech recognition on an NVIDIA GPU in this server (ADR 0053).
  # Needs an NVIDIA driver 580 or later (CUDA 13) and the NVIDIA Container
  # Toolkit on the host. Enable with COMPOSE_PROFILES=cuda, then add the
  # connection "NVIDIA GPU (this server)" in Settings > Calls > Transcription
  # and install models in its model library. The service listens on
  # 127.0.0.1 only: audio does not leave the server. One service uses one
  # GPU (TALKOPS_CUDA_DEVICE); for a second GPU, copy the service with
  # another device and port and add a second connection.
  cuda-stt:
    image: ghcr.io/itsh-neumeier/talkops-cuda-stt:${TALKOPS_VERSION:-latest}
    profiles: ["cuda"]
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TALKOPS_CUDA_LISTEN: 127.0.0.1:${TALKOPS_CUDA_PORT:-8096}
      TALKOPS_CUDA_API_KEY: ${TALKOPS_CUDA_API_KEY:-}
      TALKOPS_CUDA_QUEUE: ${TALKOPS_CUDA_QUEUE:-32}
      TALKOPS_CUDA_SESSIONS: ${TALKOPS_CUDA_SESSIONS:-8}
      TALKOPS_CUDA_PARTIAL_INTERVAL_MS: ${TALKOPS_CUDA_PARTIAL_INTERVAL_MS:-1000}
      TALKOPS_CUDA_STABLE_PREVIEW: ${TALKOPS_CUDA_STABLE_PREVIEW:-false}
      TALKOPS_CUDA_MODEL_ADMIN: ${TALKOPS_CUDA_MODEL_ADMIN:-true}
      TALKOPS_CUDA_MAX_LIBRARY_MB: ${TALKOPS_CUDA_MAX_LIBRARY_MB:-20480}
      TALKOPS_LOG_FORMAT: ${TALKOPS_LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Writable: administrators install models in the TalkOps UI.
      - models:/var/lib/talkops/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TALKOPS_CUDA_DEVICE:-0}"]
              capabilities: [gpu]

  # Optional TURN relay for the browser softphone (media over one port, e.g.
  # from outside without VPN or through strict firewalls). Enable with
  # COMPOSE_PROFILES=turn and set TALKOPS_TURN_URLS, TALKOPS_TURN_SECRET and
  # TALKOPS_TURN_PEER_IP (the address FreeSWITCH sends media from).
  coturn:
    image: coturn/coturn:4.18.0-trixie
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    # The coturn binary carries this file capability; without it in the
    # bounding set the container cannot even start it.
    cap_add:
      - NET_BIND_SERVICE
    command:
      - -n
      - --log-file=stdout
      - --listening-port=${TALKOPS_TURN_PORT:-3478}
      - --min-port=${TALKOPS_TURN_MIN_PORT:-49160}
      - --max-port=${TALKOPS_TURN_MAX_PORT:-49200}
      - --realm=talkops
      - --use-auth-secret
      - --static-auth-secret=${TALKOPS_TURN_SECRET:-}
      - --fingerprint
      - --no-tls
      - --no-multicast-peers
      # Relay only to FreeSWITCH, never into the rest of the network.
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --allowed-peer-ip=${TALKOPS_TURN_PEER_IP:-127.0.0.1}

  # Optional HTTPS reverse proxy with automatic certificates (ACME).
  # Enable with: COMPOSE_PROFILES=caddy and TALKOPS_DOMAIN=pbx.example.com
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command: caddy reverse-proxy --from ${TALKOPS_DOMAIN:-localhost} --to 127.0.0.1:${TALKOPS_HTTP_PORT:-8080}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  fax:
  postgres:
  recordings:
  voicemail:
  sounds:
  provisioning:
  snapshots:
  backups:
  models:
  freeswitch-db:
  cdr-spool:
  caddy-data:
  caddy-config:
