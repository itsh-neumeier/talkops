# NetCologne – Telefonie / ProPhone
# Status: untested. See docs/trunk-presets.md for the format.
id: netcologne
name: NetCologne
product: Telefonie / ProPhone
country: DE
status: untested
sources:
- >-
  https://wiki.unify.com/images/0/06/SIP-Trunk-Configuration-NetCologne-ProPhone.pdf
notes:
  en: >-
    Registrar and credentials are provided by NetCologne; enter them from your access data.
  de: >-
    Registrar und Zugangsdaten stellt NetCologne bereit; aus den Zugangsdaten übernehmen.
credentials:
  mode: per_number
  username_template: '{input}'
sip:
  transport: udp
  number_format: national
  caller_id_format: e164
  caller_id_header: from
  from_user: username
