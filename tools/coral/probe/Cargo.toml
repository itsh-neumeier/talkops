# Phase 0 probe: checks that the safe wrapper crate `edgefirst-tflite` can
# load libedgetpu as an external delegate and run a compiled model, with
# `unsafe` forbidden in this code. It is not a workspace member, so the
# server images do not depend on it.
[package]
name = "coral-probe"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
edgefirst-tflite = "=0.10.3"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
