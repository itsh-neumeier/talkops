# End-to-end test: builds all images, starts the production compose stack and
# runs SIPp scenarios (registration, authenticated call, CDR) against it.
name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sipp:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build FreeSWITCH image
        uses: docker/build-push-action@v6
        with:
          context: docker/freeswitch
          load: true
          tags: ghcr.io/itsh-neumeier/talkops-freeswitch:latest
          cache-from: type=gha,scope=talkops-freeswitch-amd64
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/talkops/Dockerfile
          load: true
          tags: ghcr.io/itsh-neumeier/talkops-server:latest
          cache-from: type=gha,scope=talkops-server-amd64
      - name: Build media worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/media-worker/Dockerfile
          load: true
          tags: ghcr.io/itsh-neumeier/talkops-media-worker:latest
          cache-from: type=gha,scope=talkops-media-worker-amd64

      - name: Install SIPp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sip-tester jq
          # DTMF is replayed from a pcap, which needs a raw socket.
          sudo setcap cap_net_raw,cap_net_admin+ep "$(command -v sipp)"

      - name: Start stack
        run: |
          # .env is read by every later `docker compose` call (ps, logs).
          cat > .env <<ENV
          POSTGRES_PASSWORD=ci$(openssl rand -hex 8)
          TALKOPS_SECRET_KEY=$(openssl rand -hex 32)
          TALKOPS_ESL_PASSWORD=$(openssl rand -hex 12)
          TALKOPS_XMLCURL_PASSWORD=$(openssl rand -hex 12)
          ENV
          docker compose up -d --pull missing --quiet-pull
          for i in $(seq 1 60); do
            healthy=$(docker compose ps --format '{{.Health}}' | grep -c '^healthy' || true)
            [ "$healthy" -ge 4 ] && break
            sleep 5
          done
          docker compose ps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (browser softphone test)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Run SIPp scenarios
        run: WEBRTC_E2E=1 SIP_HOST=$(hostname -I | awk '{print $1}') tests/e2e/run.sh

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 300
