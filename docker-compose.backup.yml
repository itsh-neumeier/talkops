# Optional: the separate backup password as a file. docker-compose.yml already
# mounts the Compose directory read-only for recovery backups.
# Keep backup-password outside the captured files (it is never captured).
# Use with: docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
services:
  talkops:
    environment:
      TALKOPS_BACKUP_PASSWORD_FILE: /run/backup-password
    volumes:
      - type: bind
        source: ${TALKOPS_BACKUP_PASSWORD_SOURCE:-./backup-password}
        target: /run/backup-password
        read_only: true
