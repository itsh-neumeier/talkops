name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  documentation:
    name: Bilingual handbook and Wiki
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/docs/wiki.mjs
      - run: node scripts/docs/build-wiki.mjs --check

  fax-adapters:
    name: Fax MIME and document fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install fax conversion tools
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil python3-reportlab poppler-utils fonts-dejavu-core
      - run: python3 -m unittest discover -s tests/fax -v

  coral-tools:
    name: Coral benchmark tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/coral/tests -v

  rust:
    name: Rust (fmt, clippy, test)
    # The owner's self-hosted runner (label talkops, host network) takes the
    # heavy jobs when the repository variable CI_RUNNER is "talkops". Pull
    # requests from forks always use GitHub-hosted runners.
    runs-on: ${{ vars.CI_RUNNER == 'talkops' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","talkops"]') || 'ubuntu-24.04' }}
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TALKOPS_TEST_LDAP_URL: ldap://127.0.0.1:3890
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the sherpa-onnx CPU library (cuda-stt, ADR 0054)
        run: |
          # Same version as the sherpa-onnx crate; the build does not download it.
          name=sherpa-onnx-v1.13.8-linux-x64-shared-lib
          curl -fsSLo /tmp/sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/$name.tar.bz2"
          echo "3892d184be41027e18165e67f549cd4e4cdd8dcd73ac5579e97afd55e14e30b6  /tmp/sherpa.tar.bz2" | sha256sum -c -
          tar xjf /tmp/sherpa.tar.bz2 -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/$name/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/$name/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Start OpenLDAP for the directory login tests
        run: |
          echo "slapd slapd/no_configuration boolean true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq slapd ldap-utils
          sudo systemctl stop slapd || true
          # A reused self-hosted runner keeps the directory of the previous run.
          sudo rm -rf /var/lib/ldap/talkops-test
          # Under /var/lib/ldap so the AppArmor profile of slapd allows it.
          sudo LDAP_WORK=/var/lib/ldap/talkops-test tests/ldap/start.sh
      - name: Install PostgreSQL 17 client tools (backup tests)
        run: |
          # GitHub-hosted images ship postgresql-common; the self-hosted runner does not.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client-17
      - name: Install rclone (backup target tests)
        run: |
          # Same pinned release and checksum as docker/talkops/Dockerfile.
          curl -fsSLo /tmp/rclone.zip https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  /tmp/rclone.zip" | sha256sum -c -
          unzip -oq /tmp/rclone.zip -d /tmp  # -o: the self-hosted runner keeps /tmp between jobs
          sudo install -m 0755 /tmp/rclone-v1.75.2-linux-amd64/rclone /usr/local/bin/rclone
          rclone version
      - name: Install and test the optional Cisco TFTP transport
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tftpd-hpa
          sudo python3 tests/provisioning/tftp.py
      - run: cargo test --workspace --locked
        env:
          TALKOPS_TEST_PG_BIN_DIR: /usr/lib/postgresql/17/bin
          # Shipped call map data (ADR 0044), checked by talkops-core geo tests.
          TALKOPS_GEO_DIR: ${{ github.workspace }}/presets/geo

  web:
    name: Web UI (lint, check, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - name: Verify pinned provisioning reference sources
        run: node ../tests/provisioning/reference.mjs
      - name: Check native provisioning derivatives
        run: node ../scripts/provisioning/build-native-library.mjs --check
      - name: Check manufacturer key functions
        run: node ../scripts/provisioning/build-function-catalog.mjs --check
      - run: npm run build
      - name: Setup recovery browser test
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          npm exec -- vite preview --host 127.0.0.1 --port 4178 > "$RUNNER_TEMP/recovery-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4178/setup > /dev/null && break
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node ../tests/recovery/browser.mjs
      - name: Active call and layout browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/talkops-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/talkops-browser/node_modules/.bin/playwright" install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 5184 > "$RUNNER_TEMP/talkops-preview.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5184/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/active-calls.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/dashboard-collapse.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/dashboard-charts.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/layout.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/transcription-settings.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/coral-transcription.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/coral-diagnostics.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/roles.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/settings-system.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/phone-network.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/side-panel.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/footer.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/settings-search.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/audit.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/fax.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/call-list.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/call-map.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/call-blocking.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/phonebook.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/phone-keys.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/provisioning.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/manufacturer-provisioning.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/cisco7800.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/transcriptions.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/motion.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/talkops-browser/node_modules/playwright/index.js" node ../tests/browser/call-presentation.mjs

  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
              -e 's/^TALKOPS_SECRET_KEY=$/TALKOPS_SECRET_KEY=ci/' \
              -e 's/^TALKOPS_ESL_PASSWORD=$/TALKOPS_ESL_PASSWORD=ci/' \
              -e 's/^TALKOPS_XMLCURL_PASSWORD=$/TALKOPS_XMLCURL_PASSWORD=ci/' .env.example > ci.env
          docker compose --env-file ci.env -f docker-compose.yml config -q
          docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.dev.yml config -q
          TALKOPS_TFTP_BIND_IP=192.0.2.10 docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.cisco-tftp.yml config -q
          COMPOSE_PROFILES=coral docker compose --env-file ci.env -f docker-compose.yml config -q
          COMPOSE_PROFILES=cuda docker compose --env-file ci.env -f docker-compose.yml config -q
          TALKOPS_CORAL_TEST_TAG=coral-test-ci COMPOSE_PROFILES=coral docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.coral-test.yml config -q
      - name: Production compose must not build
        run: |
          if grep -nE '^\s+build:' docker-compose.yml; then
            echo "docker-compose.yml must only reference prebuilt images" >&2
            exit 1
          fi
      - name: Validate backup override and host recovery workflow
        run: |
          docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.backup.yml config -q
          TALKOPS_NFS_HOST=nas.local docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.targets.yml config -q
          bash -n scripts/recover.sh
          bash tests/recovery/host.sh

  images:
    name: Image build (${{ matrix.image }}, ${{ matrix.arch }})
    # Same runner choice as the rust job.
    runs-on: ${{ vars.CI_RUNNER == 'talkops' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","talkops"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: talkops-server
            arch: amd64
            context: .
            dockerfile: docker/talkops/Dockerfile
          - image: talkops-media-worker
            arch: amd64
            context: .
            dockerfile: docker/media-worker/Dockerfile
          - image: talkops-coral-stt
            arch: amd64
            context: .
            dockerfile: docker/coral-stt/Dockerfile
          - image: talkops-cuda-stt
            arch: amd64
            runner: ubuntu-24.04
            context: .
            dockerfile: docker/cuda-stt/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          build-args: TALKOPS_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Smoke test
        run: docker run --rm ${{ matrix.image }}:ci --version
      - name: Fax storage with a read-only root filesystem
        if: matrix.image != 'talkops-coral-stt' && matrix.image != 'talkops-cuda-stt'
        run: bash tests/fax/storage-image.sh ${{ matrix.image }}:ci
      - name: Coral libraries load and the mock service is healthy
        if: matrix.image == 'talkops-coral-stt'
        run: bash tests/coral/image.sh ${{ matrix.image }}:ci
      - name: CUDA libraries resolve and the mock service is healthy
        if: matrix.image == 'talkops-cuda-stt'
        run: bash tests/cuda/image.sh ${{ matrix.image }}:ci

  coral-preview-images:
    name: Coral trial image (${{ matrix.image }}, amd64)
    if: github.event_name == 'push' && github.repository == 'itsh-neumeier/talkops' && github.ref == 'refs/heads/codex/coral-stable-preview'
    needs: [rust, web, documentation, coral-tools, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: talkops-server
            dockerfile: docker/talkops/Dockerfile
          - image: talkops-media-worker
            dockerfile: docker/media-worker/Dockerfile
          - image: talkops-coral-stt
            dockerfile: docker/coral-stt/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: trial
        name: Immutable trial tag
        run: echo "tag=coral-test-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/itsh-neumeier/${{ matrix.image }}:${{ steps.trial.outputs.tag }}
          build-args: TALKOPS_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/itsh-neumeier/talkops
            org.opencontainers.image.description=Optional Coral production trial; quality validation pending
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,scope=${{ matrix.image }}-amd64,mode=max
      - name: Trial image handoff
        run: |
          echo '### Coral trial image (linux/amd64)' >> "$GITHUB_STEP_SUMMARY"
          echo 'ghcr.io/itsh-neumeier/${{ matrix.image }}:${{ steps.trial.outputs.tag }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: ${{ github.sha }}. FreeSWITCH remains at 1.8.11. No stable/latest tag is changed.' >> "$GITHUB_STEP_SUMMARY"
