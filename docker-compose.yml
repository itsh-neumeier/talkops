# TalkOps – production stack (prebuilt images only, usable as Portainer stack).
#
#   cp .env.example .env   # set the passwords
#   docker compose up -d
#
# FreeSWITCH, TalkOps and the media worker use host networking: SIP and the
# RTP port range need it, and it keeps the event socket and the xml_curl
# endpoint on 127.0.0.1. Linux hosts only. See docs/installation.md.

name: talkops

x-talkops-env: &talkops-env
  TALKOPS_DATABASE_URL: postgres://${POSTGRES_USER:-talkops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-talkops}
  TALKOPS_LOG_FORMAT: ${TALKOPS_LOG_FORMAT:-json}
  RUST_LOG: ${RUST_LOG:-info}
  TZ: ${TZ:-Europe/Berlin}

# The TalkOps images run as UID 10001 and need no Linux capabilities.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-trixie
    restart: unless-stopped
    # The entrypoint needs root to prepare the data directory, then drops it.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talkops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-talkops}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Only reachable from the host (where the host-networked services run).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  talkops:
    image: ghcr.io/itsh-neumeier/talkops-server:${TALKOPS_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *talkops-env
      TALKOPS_LISTEN: ${TALKOPS_LISTEN:-0.0.0.0:8080}
      TALKOPS_ESL_ADDR: 127.0.0.1:${TALKOPS_ESL_PORT:-8021}
      TALKOPS_ESL_PASSWORD: ${TALKOPS_ESL_PASSWORD:?set TALKOPS_ESL_PASSWORD}
      TALKOPS_XMLCURL_PASSWORD: ${TALKOPS_XMLCURL_PASSWORD:?set TALKOPS_XMLCURL_PASSWORD}
      TALKOPS_SECRET_KEY: ${TALKOPS_SECRET_KEY:?set TALKOPS_SECRET_KEY}
      TALKOPS_SIP_PORT: ${TALKOPS_SIP_PORT:-5060}
      TALKOPS_SIP_TRUNK_PORT: ${TALKOPS_SIP_TRUNK_PORT:-5080}
      TALKOPS_METRICS_TOKEN: ${TALKOPS_METRICS_TOKEN:-}
      TALKOPS_TURN_URLS: ${TALKOPS_TURN_URLS:-}
      TALKOPS_TURN_SECRET: ${TALKOPS_TURN_SECRET:-}
      TALKOPS_TURN_RELAY_ONLY: ${TALKOPS_TURN_RELAY_ONLY:-false}
    volumes:
      - recordings:/var/lib/talkops/recordings
      - voicemail:/var/lib/talkops/voicemail
      - sounds:/var/lib/talkops/sounds
      - provisioning:/var/lib/talkops/provisioning
      - snapshots:/var/lib/talkops/snapshots
      - backups:/var/lib/talkops/backups

  freeswitch:
    image: ghcr.io/itsh-neumeier/talkops-freeswitch:${TALKOPS_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    # FreeSWITCH loads its configuration from TalkOps at startup.
    depends_on:
      talkops:
        condition: service_healthy
    environment:
      TALKOPS_ESL_PORT: ${TALKOPS_ESL_PORT:-8021}
      TALKOPS_ESL_PASSWORD: ${TALKOPS_ESL_PASSWORD:?set TALKOPS_ESL_PASSWORD}
      TALKOPS_XMLCURL_URL: http://127.0.0.1:${TALKOPS_HTTP_PORT:-8080}/fs/xml
      TALKOPS_CDR_URL: http://127.0.0.1:${TALKOPS_HTTP_PORT:-8080}/fs/cdr
      TALKOPS_XMLCURL_PASSWORD: ${TALKOPS_XMLCURL_PASSWORD:?set TALKOPS_XMLCURL_PASSWORD}
      TALKOPS_RTP_START_PORT: ${TALKOPS_RTP_START_PORT:-16384}
      TALKOPS_RTP_END_PORT: ${TALKOPS_RTP_END_PORT:-16999}
      TALKOPS_FS_LOG_LEVEL: ${TALKOPS_FS_LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - recordings:/var/lib/talkops/recordings
      - voicemail:/var/lib/talkops/voicemail
      - sounds:/var/lib/talkops/sounds
      - freeswitch-db:/usr/local/freeswitch/var/lib/freeswitch/db

  media-worker:
    image: ghcr.io/itsh-neumeier/talkops-media-worker:${TALKOPS_VERSION:-latest}
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *talkops-env
      TALKOPS_WHISPER_MODEL: ${TALKOPS_WHISPER_MODEL:-base}
    volumes:
      - recordings:/var/lib/talkops/recordings
      - voicemail:/var/lib/talkops/voicemail
      - sounds:/var/lib/talkops/sounds
      - models:/var/lib/talkops/models

  # Optional TURN relay for the browser softphone (media over one port, e.g.
  # from outside without VPN or through strict firewalls). Enable with
  # COMPOSE_PROFILES=turn and set TALKOPS_TURN_URLS, TALKOPS_TURN_SECRET and
  # TALKOPS_TURN_PEER_IP (the address FreeSWITCH sends media from).
  coturn:
    image: coturn/coturn:4.18.0-trixie
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    <<: *hardened
    # The coturn binary carries this file capability; without it in the
    # bounding set the container cannot even start it.
    cap_add:
      - NET_BIND_SERVICE
    command:
      - -n
      - --log-file=stdout
      - --listening-port=${TALKOPS_TURN_PORT:-3478}
      - --min-port=${TALKOPS_TURN_MIN_PORT:-49160}
      - --max-port=${TALKOPS_TURN_MAX_PORT:-49200}
      - --realm=talkops
      - --use-auth-secret
      - --static-auth-secret=${TALKOPS_TURN_SECRET:-}
      - --fingerprint
      - --no-tls
      - --no-multicast-peers
      # Relay only to FreeSWITCH, never into the rest of the network.
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --allowed-peer-ip=${TALKOPS_TURN_PEER_IP:-127.0.0.1}

  # Optional HTTPS reverse proxy with automatic certificates (ACME).
  # Enable with: COMPOSE_PROFILES=caddy and TALKOPS_DOMAIN=pbx.example.com
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command: caddy reverse-proxy --from ${TALKOPS_DOMAIN:-localhost} --to 127.0.0.1:${TALKOPS_HTTP_PORT:-8080}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres:
  recordings:
  voicemail:
  sounds:
  provisioning:
  snapshots:
  backups:
  models:
  freeswitch-db:
  caddy-data:
  caddy-config:
