# Deutsche Glasfaser – Glasfaser-Anschluss (Privat)
# Status: untested. See docs/trunk-presets.md for the format.
id: deutsche-glasfaser
name: Deutsche Glasfaser
product: Glasfaser-Anschluss (Privat)
country: DE
status: untested
sources:
- https://community.zyxel.com/en/discussion/comment/43009
notes:
  en: >-
    Credentials (number, username, password) come by letter or from the customer portal. The registrar
    seen in practice is dg.voip.dg-w.de; check your letter.
  de: >-
    Zugangsdaten (Rufnummer, Benutzername, Passwort) per Brief oder im Kundenportal. In der Praxis genutzter
    Registrar: dg.voip.dg-w.de; bitte mit dem Brief abgleichen.
credentials:
  mode: per_number
  username_template: '{input}'
sip:
  registrar: dg.voip.dg-w.de
  transport: udp
  number_format: national
  caller_id_format: e164
  caller_id_header: from
  from_user: username
