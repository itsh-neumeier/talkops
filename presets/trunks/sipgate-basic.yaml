# sipgate – sipgate basic
# Status: untested. See docs/trunk-presets.md for the format.
id: sipgate-basic
name: sipgate
product: sipgate basic
country: DE
status: untested
sources:
- >-
  https://techdocs.audiocodes.com/livehub/Content/LiveHub/interop_configuration_sipgate_basic_trunk.htm
notes:
  en: Username = SIP-ID from the sipgate web interface.
  de: Benutzername = SIP-ID aus der sipgate-Weboberfläche.
credentials:
  mode: shared
  username_template: '{input}'
  username_hint:
    en: SIP-ID
    de: SIP-ID
sip:
  registrar: sipgate.de
  transport: udp
  number_format: e164_no_plus
  caller_id_format: e164_no_plus
  caller_id_header: from
  from_user: username
