# Deutsche Telekom – IP-Anschluss (MagentaZuhause / Privat)
# Status: untested. See docs/trunk-presets.md for the format.
id: telekom-ip-anschluss
name: Deutsche Telekom
product: IP-Anschluss (MagentaZuhause / Privat)
country: DE
status: untested
sources:
- >-
  https://www.telekom.de/hilfe/festnetz-internet-tv/telefonieren-einstellungen/ip-telefonie-mit-anderen-clients
notes:
  en: >-
    Registration only works from the Telekom line the number belongs to. Username = phone number, authentication
    name = Telekom login e-mail address. STUN: stun.t-online.de.
  de: >-
    Registrierung nur über den Telekom-Anschluss, zu dem die Rufnummer gehört. Benutzername = Rufnummer,
    Authentifizierungsname = Telekom-Login (E-Mail-Adresse). STUN: stun.t-online.de.
credentials:
  mode: per_number
  username_template: '{e164}'
  auth_username_template: '{input}'
  username_hint:
    en: Telekom login e-mail address
    de: Telekom-Login (E-Mail-Adresse)
sip:
  registrar: tel.t-online.de
  realm: tel.t-online.de
  transport: udp
  number_format: national
  caller_id_format: e164
  caller_id_header: from
  from_user: username
  ping_seconds: 30
