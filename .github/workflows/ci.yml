name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web UI (lint, check, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
              -e 's/^TALKOPS_SECRET_KEY=$/TALKOPS_SECRET_KEY=ci/' \
              -e 's/^TALKOPS_ESL_PASSWORD=$/TALKOPS_ESL_PASSWORD=ci/' \
              -e 's/^TALKOPS_XMLCURL_PASSWORD=$/TALKOPS_XMLCURL_PASSWORD=ci/' .env.example > ci.env
          docker compose --env-file ci.env -f docker-compose.yml config -q
          docker compose --env-file ci.env -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Production compose must not build
        run: |
          if grep -nE '^\s+build:' docker-compose.yml; then
            echo "docker-compose.yml must only reference prebuilt images" >&2
            exit 1
          fi

  images:
    name: Image build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: talkops-server
            context: .
            dockerfile: docker/talkops/Dockerfile
          - image: talkops-media-worker
            context: .
            dockerfile: docker/media-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,scope=${{ matrix.image }}-amd64,mode=max
      - name: Smoke test
        run: docker run --rm ${{ matrix.image }}:ci --version
